name: Fuzzing Tests

on:
  schedule:
    - cron: '0 2 * * 1'  # Every Monday at 02:00 UTC
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'include/**'
      - 'fuzz/**'
      - '.github/workflows/fuzzing.yml'
  workflow_dispatch:
    inputs:
      fuzz_duration:
        description: 'Fuzzing duration in seconds'
        required: false
        default: '300'

jobs:
  fuzz:
    name: Fuzz Testing
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Checkout common_system (optional dependency)
        uses: actions/checkout@v6
        continue-on-error: true
        with:
          repository: kcenon/common_system
          path: common_system
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          # Ubuntu 24.04 has GCC 14 by default with C++20 <format> support
          sudo apt-get install -y cmake ninja-build clang llvm libgtest-dev python3

      - name: Generate seed corpus
        run: |
          python3 fuzz/generate_corpus.py
          ls -la corpus/

      - name: Configure with Fuzzing
        run: |
          CC=clang CXX=clang++ cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_FUZZING=ON \
            -DBUILD_TESTS=OFF \
            -DBUILD_CONTAINER_SAMPLES=OFF

      - name: Build fuzz targets
        id: build_fuzz
        run: cmake --build build --target fuzz_deserialize fuzz_container_deserialize

      - name: Run depth regression corpus
        shell: bash
        run: |
          for seed in corpus/depth/*; do
            ./build/bin/fuzz_deserialize "$seed" -runs=1 -max_len=1048576
          done

      - name: Run value deserialize fuzzing
        id: fuzz_value
        shell: bash
        env:
          FUZZ_DURATION: ${{ github.event.inputs.fuzz_duration || '300' }}
        run: |
          if [[ ! "$FUZZ_DURATION" =~ ^[1-9][0-9]{0,2}$ ]] || (( FUZZ_DURATION > 600 )); then
            echo "Invalid fuzz duration (expected 1..600 seconds)"
            exit 1
          fi
          ./build/bin/fuzz_deserialize corpus/deserialize \
            -max_total_time="$FUZZ_DURATION" \
            -max_len=4096 \
            -print_final_stats=1 \
            2>&1 | tee fuzz_deserialize.log

      - name: Run container deserialize fuzzing
        id: fuzz_container
        if: ${{ !cancelled() && steps.build_fuzz.outcome == 'success' }}
        shell: bash
        env:
          FUZZ_DURATION: ${{ github.event.inputs.fuzz_duration || '300' }}
        run: |
          if [[ ! "$FUZZ_DURATION" =~ ^[1-9][0-9]{0,2}$ ]] || (( FUZZ_DURATION > 600 )); then
            echo "Invalid fuzz duration (expected 1..600 seconds)"
            exit 1
          fi
          ./build/bin/fuzz_container_deserialize corpus/container \
            -max_total_time="$FUZZ_DURATION" \
            -max_len=8192 \
            -print_final_stats=1 \
            2>&1 | tee fuzz_container.log

      - name: Check for crashes
        run: |
          if ls crash-* 1> /dev/null 2>&1; then
            echo "Crashes found!"
            ls -la crash-*
            for crash in crash-*; do
              echo "=== $crash ==="
              xxd "$crash" | head -20
            done
            exit 1
          fi
          echo "No crashes found - fuzzing completed successfully"

      - name: Generate summary
        if: always()
        env:
          FUZZ_STATUS: ${{ job.status }}
        run: |
          shopt -s nullglob
          crashes=(crash-* leak-* timeout-*)
          values=(corpus/deserialize/*)
          containers=(corpus/container/*)
          depths=(corpus/depth/*)
          {
            echo "## Fuzzing Results"
            echo ""
            if (( ${#crashes[@]} > 0 )); then
              echo ":x: **Crashes detected**"
              echo ""
              echo "| File | Size |"
              echo "|------|------|"
              for crash in "${crashes[@]}"; do
                size=$(stat -c%s "$crash")
                printf '| %s | %s bytes |\n' "$crash" "$size"
              done
            elif [ "$FUZZ_STATUS" = success ]; then
              echo ":white_check_mark: **No crashes found**"
            else
              echo ":x: **Fuzzing did not complete successfully; inspect job logs**"
            fi
            echo ""
            echo "### Corpus Statistics"
            echo "- Deserialize corpus: ${#values[@]} files"
            echo "- Container corpus: ${#containers[@]} files"
            echo "- Depth regression corpus: ${#depths[@]} files"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload corpus
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-corpus
          path: corpus/
          retention-days: 90

      - name: Upload crashes
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-crashes
          path: |
            crash-*
            fuzz_*.log

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-logs
          path: fuzz_*.log
          retention-days: 30
